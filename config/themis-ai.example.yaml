# Copy to <workspace>/.themis-ai.yaml. Every key is optional; defaults live in
# src/themis_ai/config.py. Unknown keys are rejected.
openai:
  model: gpt-5                   # or set THEMIS_AI_OPENAI_MODEL
  api_key_env: OPENAI_API_KEY
claude:
  permission_mode: acceptEdits
  resume_session: true
  # mcp_config: /opt/chopin/config/claude-mcp.json
tests:
  command: [make, test]
  timeout_seconds: 1200
lint:
  command: [make, vet]
workflow:
  base_branch: main
  branch_prefix: agent/
  max_iterations: 3
  max_cost_usd: 25
  require_design_approval: false
  pause_on_open_questions: true
  security_review: true
  final_review: true
  block_on_severity: high        # info | low | medium | high | critical
  delivery: commit               # commit | merge (approval) | push (approval)
  remote: origin
guardrails:
  # Extend rather than replace: listing a key replaces its default list.
  require_approval: [git_push, git_merge, delete_branch, delete_data, deploy,
                     modify_credentials, modify_infrastructure, approve_design]
themis:
  base_url: http://localhost:8080/api/v1
  api_key_env: THEMIS_API_KEY
