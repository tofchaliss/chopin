[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chopin"
version = "0.1.0"
description = "Autonomous multi-agent runtime for Themis: OpenAI architecture/review + Claude Code implementation over local Git and MCP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6",
]

[project.optional-dependencies]
openai = ["openai>=1.60"]
mcp = ["mcp>=2"]
all = ["openai>=1.60", "mcp>=2"]
dev = ["pytest>=8"]

[project.scripts]
themis-ai = "themis_ai.cli:main"
themis-ai-mcp = "themis_ai.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
